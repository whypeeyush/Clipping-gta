<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Cutter</title>
<style>
  :root { --bg:#0e0f13; --card:#181a21; --line:#2a2d38; --txt:#f2f3f7; --mute:#8d92a3; --acc:#7c5cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.4 system-ui,sans-serif; padding:16px; }
  .wrap { max-width:560px; margin:0 auto; display:grid; gap:14px; }
  h1 { font-size:22px; margin:6px 0 0; }
  p.sub { margin:0; color:var(--mute); font-size:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; display:grid; gap:10px; }
  input[type=text], input[type=number], select { width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#101218; color:var(--txt); font-size:16px; }
  button { padding:13px; border:0; border-radius:10px; background:var(--acc); color:#fff; font-size:16px; font-weight:600; }
  button.alt { background:#2a2d38; }
  button:disabled { opacity:.5; }
  label { font-size:13px; color:var(--mute); display:block; margin-bottom:2px; }
  input[type=range] { width:100%; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .preview { display:flex; justify-content:center; }
  .preview img { width:60%; max-width:260px; border-radius:12px; border:1px solid var(--line); }
  .status { font-size:14px; color:var(--mute); }
  .err { color:#ff7a7a; }
  .clip { display:grid; gap:6px; }
  video { width:100%; border-radius:12px; background:#000; }
  a.dl { display:block; text-align:center; padding:11px; border-radius:10px; background:#2a2d38; color:var(--txt); text-decoration:none; }
  .or { text-align:center; color:var(--mute); font-size:13px; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Clip Cutter</h1>
  <p class="sub">Paste a video link (only videos you own or have permission to use). Get vertical 9:16 clips: gameplay on top, face cam below.</p>

  <div class="card" id="step1">
    <input type="text" id="url" placeholder="Paste YouTube link">
    <div class="or">or upload the video file</div>
    <input type="file" id="file" accept="video/*">
    <button id="fetchBtn">Load video</button>
    <div class="status" id="s1"></div>
  </div>

  <div class="card hide" id="step2">
    <div class="preview"><img id="pv" alt="layout preview"></div>
    <p class="sub">Adjust until the face cam is framed well, then tap Update preview.</p>
    <div><label>Gameplay position (left to right)</label><input type="range" id="gx" min="0" max="1" step="0.01" value="0.5"></div>
    <div><label>Face cam: left edge</label><input type="range" id="fx" min="0" max="1" step="0.01" value="0"></div>
    <div><label>Face cam: top edge</label><input type="range" id="fy" min="0" max="1" step="0.01" value="0.3"></div>
    <div><label>Face cam: width</label><input type="range" id="fw" min="0.05" max="1" step="0.01" value="0.25"></div>
    <div><label>Face cam: height</label><input type="range" id="fh" min="0.05" max="1" step="0.01" value="0.4"></div>
    <button class="alt" id="pvBtn">Update preview</button>

    <div class="row">
      <div><label>Clip length</label>
        <select id="dur"><option>20</option><option selected>30</option><option>40</option><option>45</option><option>60</option></select></div>
      <div><label>Number of clips</label><input type="number" id="count" value="5" min="1" max="20"></div>
    </div>
    <div><label>Start at (seconds)</label><input type="number" id="start" value="0" min="0"></div>
    <button id="goBtn">Create clips</button>
    <div class="status" id="s2"></div>
  </div>

  <div class="card hide" id="step3">
    <a class="dl" id="zip" href="#">Download all (zip)</a>
    <div id="clips" class="wrap" style="gap:16px"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let jid = null;
const P = () => ({gx:+$('gx').value, fx:+$('fx').value, fy:+$('fy').value, fw:+$('fw').value, fh:+$('fh').value});
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function poll(onTick) {
  while (true) {
    const j = await (await fetch('/api/job/' + jid)).json();
    onTick(j);
    if (['ready','done','error'].includes(j.status)) return j;
    await sleep(1500);
  }
}

$('fetchBtn').onclick = async () => {
  $('s1').className = 'status'; $('s1').textContent = 'Loading video...';
  $('fetchBtn').disabled = true;
  const fd = new FormData();
  if ($('file').files[0]) fd.append('file', $('file').files[0]); else fd.append('url', $('url').value);
  const r = await fetch('/api/fetch', {method:'POST', body:fd});
  const d = await r.json();
  if (d.error) { $('s1').className = 'status err'; $('s1').textContent = d.error; $('fetchBtn').disabled = false; return; }
  jid = d.id;
  const j = await poll(j => { $('s1').textContent = j.status === 'downloading' ? 'Downloading... this can take a minute' : ''; });
  $('fetchBtn').disabled = false;
  if (j.status === 'error') { $('s1').className = 'status err'; $('s1').textContent = j.error + ' (if YouTube blocks it, download the video and use the upload option)'; return; }
  $('pv').src = j.preview;
  $('s1').textContent = 'Video length: ' + Math.round(j.duration) + 's';
  $('step2').classList.remove('hide');
};

$('pvBtn').onclick = async () => {
  $('pvBtn').disabled = true;
  const r = await fetch('/api/preview/' + jid, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(P())});
  const d = await r.json();
  if (d.preview) $('pv').src = d.preview;
  $('pvBtn').disabled = false;
};

$('goBtn').onclick = async () => {
  $('goBtn').disabled = true; $('s2').className = 'status';
  const body = {...P(), duration:+$('dur').value, count:+$('count').value, start:+$('start').value};
  const r = await fetch('/api/render/' + jid, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
  const d = await r.json();
  if (d.error) { $('s2').className = 'status err'; $('s2').textContent = d.error; $('goBtn').disabled = false; return; }
  const j = await poll(j => { $('s2').textContent = 'Rendering clip ' + ((j.done||0) + 1) + ' of ' + (j.count||'...'); });
  $('goBtn').disabled = false;
  if (j.status === 'error') { $('s2').className = 'status err'; $('s2').textContent = j.error; return; }
  $('s2').textContent = 'Done! ' + j.clips.length + ' clips ready.';
  $('zip').href = '/api/zip/' + jid;
  $('clips').innerHTML = j.clips.map((c, i) =>
    `<div class="clip"><video src="${c}" controls playsinline preload="metadata"></video><a class="dl" href="${c}" download>Download clip ${i+1}</a></div>`).join('');
  $('step3').classList.remove('hide');
};
</script>
</body>
</html>
